name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoMoney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MoMoney/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage --ci
